name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One group per event and ref; only pull-request runs are cancelled by newer pushes.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "ruff>=0.17"
      - run: ruff check .
      - run: ruff format --check .

  citation:
    name: citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests (Earth Engine tests are skipped without credentials)
        run: pytest --cov --cov-report=term-missing
      - name: Report coverage total
        run: |
          total=$(coverage report --format=total)
          echo "Coverage total: ${total}%"
          echo "### Coverage (${{ matrix.os }}, Python ${{ matrix.python-version }}): ${total}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Check coverage thresholds of the offline modules (80 % overall, 90 % per module)
        run: |
          coverage json -o coverage.json
          python .github/scripts/check_coverage.py coverage.json --offline

  test-ee:
    # Runs once the repository variables EE_PROJECT, EE_WIF_PROVIDER and EE_SERVICE_ACCOUNT exist
    # (Workload Identity Federation, no stored key); never for pull requests from forks.
    name: test (Earth Engine)
    if: >-
      vars.EE_WIF_PROVIDER != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.EE_WIF_PROVIDER }}
          service_account: ${{ vars.EE_SERVICE_ACCOUNT }}
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run all tests, Earth Engine included, with the full coverage check
        env:
          EE_PROJECT: ${{ vars.EE_PROJECT }}
        run: |
          pytest --cov --cov-report=term-missing
          coverage json -o coverage.json
          python .github/scripts/check_coverage.py coverage.json

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the contents of the wheel and the source distribution
        run: python .github/scripts/check_dist.py dist
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import topocorr; print('wheel ok', topocorr.__version__)"
